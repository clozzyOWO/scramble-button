let currentX = window.innerWidth / 2 - 100;
let currentY = window.innerHeight / 2 - 100;
let targetX = currentX;
let targetY = currentY;
const ease = 0.02;
const btnSize = 200;
function getRandomTarget() {
    const maxX = window.innerWidth - btnSize - 20;
    const maxY = window.innerHeight - btnSize - 20;
    targetX = 20 + Math.random() * Math.max(0, maxX);
    targetY = 20 + Math.random() * Math.max(0, maxY);
}
function smoothRandomMove() {
    if (!isMoving) return;
    let dx = targetX - currentX;
    let dy = targetY - currentY;
    currentX += dx * ease;
    currentY += dy * ease;
    currentX = Math.max(10, Math.min(currentX, window.innerWidth - btnSize - 10));
    currentY = Math.max(10, Math.min(currentY, window.innerHeight - btnSize - 10));
    clickBtn.style.left = currentX + "px";
    clickBtn.style.top = currentY + "px";
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
        getRandomTarget();
    }
    animationId = requestAnimationFrame(smoothRandomMove);
}

function playClickSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.08);
    } catch (e) {}
}

function updateUI() {

    }

function finishStage() {
    const stage = stages[currentStage];
    if (stage && typeof stage.onComplete === "function") {
        stage.onComplete();
    }
    const textSpan = clickBtn.querySelector("span");
    if (textSpan) textSpan.textContent = "";
    counterText.textContent = "";
    clickBtn.disabled = true;
    setTimeout(() => {
        currentStage++;
        if (currentStage >= stages.length) {
            if (textSpan) textSpan.textContent = "";
            counterText.textContent = "";
            return;
        }
        clickBtn.disabled = false;
        updateUI();
    }, 1500);
}
